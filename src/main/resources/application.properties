spring.application.name=supportdesk
server.address=127.0.0.1
server.port=${PORT:8080}
spring.datasource.url=${SUPPORTDESK_DB_URL:jdbc:h2:file:./data/supportdesk}
spring.datasource.username=${SUPPORTDESK_DB_USERNAME:sa}
spring.datasource.password=${SUPPORTDESK_DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,optional:classpath:assistant-schema.sql
spring.flyway.enabled=false
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.enabled=false
supportdesk.demo-password=${SUPPORTDESK_DEMO_PASSWORD:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.tracking-modes=cookie
